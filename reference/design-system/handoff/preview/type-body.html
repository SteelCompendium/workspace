<!-- @dsCard group="Type" -->
<!DOCTYPE html>
<html data-md-color-scheme="slate">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { background: var(--bg); padding: 26px 32px; }
  p { font-family: var(--font-body); font-size: 17px; line-height: 1.7; color: var(--fg); margin: 0 0 12px; max-width: 60ch; }
  em { color: var(--fg-light); }
  code { font-family: var(--font-mono); background: var(--code-bg); color: var(--accent); padding: 0.1em 0.4em; border-radius: 4px; font-size: 0.85em; }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-lighter); margin-top: 8px; }
</style>
</head>
<body>
  <p>The power of the gods flows through you. As a vessel for divine power, you don't just keep your allies in the fight—you make them more effective. <em>Roll <code>2d10</code> and add your characteristic.</em></p>
  <div class="meta">Berlingske Slab Demibold · body 17px / line-height 1.7 · JetBrains Mono for code</div>
</body>
</html>
