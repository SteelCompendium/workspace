<!DOCTYPE html>
<html data-md-color-scheme="slate">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { background: var(--bg); padding: 26px 32px; }
  .row { font-family: var(--font-subhead); color: var(--fg); line-height: 1.15; margin: 0 0 6px; }
  .h3 { font-size: 34px; }
  .h4 { font-size: 26px; font-weight: bold; }
  .h5 { font-size: 22px; font-weight: normal; color: var(--fg-light); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-lighter); margin-top: 14px; }
</style>
</head>
<body>
  <div class="row h3">Signature Ability</div>
  <div class="row h4">Kit Bonuses</div>
  <div class="row h5">Equipment & Loadout</div>
  <div class="meta">Test Newzald · H3–H6 subheads · fallback Source Serif 4</div>
</body>
</html>
