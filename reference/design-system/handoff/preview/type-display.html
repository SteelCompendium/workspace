<!DOCTYPE html>
<html data-md-color-scheme="slate">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { background: var(--bg); padding: 28px 32px; }
  .display { font-family: var(--font-display); text-transform: uppercase; color: var(--sc-steel-lighter); line-height: 0.95; }
  .h1 { font-size: 64px; }
  .h2 { font-size: 38px; color: var(--fg); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--fg-lighter); margin-top: 14px; letter-spacing: 0.02em; }
</style>
</head>
<body>
  <div class="display h1">Draw Steel</div>
  <div class="display h2">Browse Rules</div>
  <div class="meta">Beaufort W01 Heavy · H1 5rem / H2 3rem · UPPERCASE · fallback Source Serif 4</div>
</body>
</html>
