<!-- @dsCard group="Colors" -->
<!DOCTYPE html>
<html data-md-color-scheme="slate">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { background: var(--bg); padding: 24px 28px; font-family: var(--font-body); }
  .big { display:flex; gap: 16px; align-items:stretch; }
  .swatch { width: 130px; height: 96px; border-radius: var(--radius-md); background: var(--accent); display:flex; align-items:flex-end; padding: 8px; box-sizing:border-box; }
  .swatch span { font-family: var(--font-mono); font-size: 11px; color: #08272b; font-weight:700; }
  .txt { flex:1; color: var(--fg); }
  .txt h4 { font-family: var(--font-subhead); margin: 0 0 6px; font-size: 18px; color: var(--fg); }
  .txt a { color: var(--link); font-size: 16px; }
  .txt .tt { display:inline-block; margin-top:10px; padding: 3px 10px; border-radius: 1em; background: var(--accent-transparent); color: var(--accent); font-family: var(--font-mono); font-size: 12px; }
</style>
</head>
<body>
  <div class="big">
    <div class="swatch"><span>#4db8c7</span></div>
    <div class="txt">
      <h4>Steel Teal — accent</h4>
      <a href="#">Links, active states &amp; focus rings</a>
      <div class="tt">21 · count badge</div>
    </div>
  </div>
</body>
</html>
