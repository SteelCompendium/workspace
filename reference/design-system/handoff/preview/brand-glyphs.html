<!-- @dsCard group="Brand" -->
<!DOCTYPE html>
<html data-md-color-scheme="slate">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  html,body { margin:0; }
  body { background: var(--bg); padding: 20px 24px; }
  .grid { display:grid; grid-template-columns: repeat(6,1fr); gap: 10px; }
  .cell { text-align:center; background: var(--bg-light); border:1px solid var(--fg-lightest); border-radius: var(--radius-sm); padding: 10px 4px; }
  .g { font-family: var(--font-glyph); font-size: 30px; color: var(--accent); display:block; line-height:1; min-height: 34px; }
  .n { font-family: var(--font-mono); font-size: 9px; color: var(--fg-lighter); margin-top: 6px; }
</style>
</head>
<body>
  <div class="grid">
    <div class="cell"><span class="g">!</span><span class="n">≤11</span></div>
    <div class="cell"><span class="g">@</span><span class="n">12–16</span></div>
    <div class="cell"><span class="g">#</span><span class="n">17+</span></div>
    <div class="cell"><span class="g">^</span><span class="n">passive ★</span></div>
    <div class="cell"><span class="g">d</span><span class="n">villain ☠</span></div>
    <div class="cell"><span class="g">c</span><span class="n">area</span></div>
    <div class="cell"><span class="g">0</span><span class="n">0</span></div>
    <div class="cell"><span class="g">1</span><span class="n">1</span></div>
    <div class="cell"><span class="g">2</span><span class="n">2</span></div>
    <div class="cell"><span class="g">3</span><span class="n">3</span></div>
    <div class="cell"><span class="g">4</span><span class="n">4</span></div>
    <div class="cell"><span class="g">5</span><span class="n">5</span></div>
  </div>
</body>
</html>
